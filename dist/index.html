<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#182e1d"><meta name="description" content="A little Christmas magic for the rowing club. Open a new door every day from 1–24 December."><title>Oars of Advent · Furnivall Sculling Club</title><link rel="stylesheet" href="style.css"></head>
<body><header class="winter-header" aria-label="Winter on the Thames"><img src="assets/winter-hammersmith.png" alt="A festive watercolour of a rowing crew beneath Hammersmith Bridge in the snow" width="2172" height="724" fetchpriority="high"></header><main aria-label="Furnivall advent calendar"><div class="calendar" id="calendar" aria-label="24 advent calendar doors"></div></main>
